<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5E4B8"/>
      <stop offset="35%" stopColor="#DFCA9E"/>
      <stop offset="70%" stopColor="#C5A059"/>
      <stop offset="100%" stopColor="#E2CFA8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#16171B"/>
      <stop offset="100%" stopColor="#08090B"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" floodColor="#C5A059" floodOpacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base (Rounded Squircle for perfect browser tab contrast) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Inner Art Nouveau Corner & Border Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.85">
    <!-- Inner subtle inset border -->
    <rect x="12" y="12" width="104" height="104" rx="20" stroke-width="1.2" opacity="0.6"/>
    
    <!-- Top & Bottom Liberty Filigree Accents -->
    <path d="M 52 17 C 60 14 68 14 76 17" stroke-linecap="round"/>
    <circle cx="64" cy="14" r="1.5" fill="url(#goldGrad)"/>
    
    <path d="M 52 111 C 60 114 68 114 76 111" stroke-linecap="round"/>
    <circle cx="64" cy="114" r="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Central "A" Art Nouveau Monogram (High legibility at 16px/32px) -->
  <g fill="url(#goldGrad)" filter="url(#subtleGlow)">
    <!-- Main Left Stem -->
    <path d="M 33 96 L 40 96 L 62 31 L 55 31 Z" />
    
    <!-- Main Right Thick Stem -->
    <path d="M 58 31 L 86 96 L 94 96 L 66 31 Z" />
    
    <!-- Top Apex Arch & Liberty Crown -->
    <path d="M 54 32 C 60 28 68 28 74 32 L 64 36 Z" />
    
    <!-- High-waisted Stylized Crossbar with Art Nouveau Droplet -->
    <path d="M 43 73 L 78 73 L 76 78 L 45 78 Z" />
    <circle cx="60.5" cy="84" r="2.2" />
    
    <!-- Left Base Serif with Art Nouveau sweep -->
    <path d="M 28 96 L 46 96 L 46 93 C 40 93 38 92 36 88 L 30 88 C 29 93 28 96 28 96 Z" />
    
    <!-- Right Base Serif with graceful Art Nouveau flourish curl -->
    <path d="M 80 96 L 98 96 C 98 93 96 90 92 90 C 89 90 87 92 85 96 Z" />
    <path d="M 94 93 C 99 92 103 87 101 82 C 99 78 94 80 94 84 C 94 87 97 88 95 93" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
